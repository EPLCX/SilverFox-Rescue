[package]
name = "silverfox-rescue"
version = "2026.10.3+1"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
walkdir = "2"
quick-xml = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }
msi = "0.10"
cab = "0.6"
aes = "0.8"
ctr = "0.9"

winapi = { version = "0.3", features = ["d3d11", "d3dcommon", "dxgi", "dxgiformat", "winerror", "combaseapi", "objbase", "shobjidl", "shobjidl_core", "shlobj", "knownfolders"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_System_RestartManager",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_Storage_FileSystem",
  "Win32_UI_Controls",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Touch",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
ring = "0.17"
sha2 = "0.10"
serde_json = "1"
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false          # 确保不生成debug info
overflow-checks = false # release默认已关闭,显式声明

# Optimized test profile without the release UAC manifest, used for GPU/CPU
# performance validation in CI and from a non-elevated developer terminal.
[profile.benchmark]
inherits = "release"
strip = "none"

[patch.crates-io]
cab = { path = "vendor/cab" }
